<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<DirectoryMatch "^/var/www/html/(config|controllers|models|middleware|storage|services|vendor|scripts)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(md|me|sql|ini|conf|log)$|^Dockerfile$)">
    Require all denied
</FilesMatch>
