# Add this block inside the WAMP VirtualHost for port 80, replacing the
# subnet with the Wi-Fi subnet shared by the computer and phone.
# Keep the existing parent DocumentRoot and its Require local rule.
<Directory "${INSTALL_DIR}/www/Kanto-KTX/">
    Options -Indexes
    AllowOverride All
    <RequireAny>
        Require local
        Require ip 192.168.1.0/24
    </RequireAny>
    <FilesMatch "(?i)(^\.|\.(?:md|me|sql|ini|conf|log|lock|json)$)">
        Require all denied
    </FilesMatch>
    RewriteEngine On
    RewriteRule ^(?i:config|controllers|models|middleware|storage|services|scripts|tests|tools|vendor|docs)(/|$) - [F,L]
</Directory>
